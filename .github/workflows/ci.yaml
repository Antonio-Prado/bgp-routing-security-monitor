name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: "1.25.0"
          cache: false
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12.0
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: "1.25.0"
          cache: false
      - run: go test -race -count=1 ./...
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, darwin]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: "1.25.0"
          cache: false
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          VERSION=${GITHUB_REF_NAME:-dev}
          COMMIT=${GITHUB_SHA::8}
          DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          MODULE=$(head -1 go.mod | awk '{print $2}')
          go build -ldflags "-s -w \
            -X ${MODULE}/internal/buildinfo.Version=${VERSION} \
            -X ${MODULE}/internal/buildinfo.Commit=${COMMIT} \
            -X ${MODULE}/internal/buildinfo.Date=${DATE}" \
            -o "raven-${GOOS}-${GOARCH}" ./cmd/raven
      - name: Check build metadata
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        run: |
          VERSION=${GITHUB_REF_NAME:-dev}
          COMMIT=${GITHUB_SHA::8}
          ./raven-linux-amd64 version | grep -F "raven ${VERSION}"
          ./raven-linux-amd64 version | grep -F "commit: ${COMMIT}"
  proto-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: bufbuild/buf-action@37ac33d8960807670a6e9719080e885197b09cc6 # v1.7.0
        with:
          # Install buf only. buf-action otherwise runs its own lint, format
          # and breaking steps on pull requests and a BSR push on pushes.
          setup_only: true
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - run: buf lint proto/
      # On pull_request, checkout leaves HEAD detached on the PR merge ref and
      # main exists only as origin/main. buf's '.git#branch=main' fetches from
      # the local repo's own branches, so create main if it isn't there.
      - run: git show-ref --verify --quiet refs/heads/main || git branch main origin/main
        if: github.event_name == 'pull_request'
      - run: buf breaking --against '.git#branch=main'
        if: github.event_name == 'pull_request'
